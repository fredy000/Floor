<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>תצוגת מצלמה</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
    }
    .camera-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    video {
      width: 100%;
      max-width: 500px;
      border-radius: 8px;
      background-color: #000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: #007bff;
      color: white;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #0056b3;
    }
    #error-msg {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="camera-container">
    <video id="webcam" autoplay playsinline muted></video>
    <button id="camera-btn">הפעל מצלמה</button>
    <p id="error-msg"></p>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const cameraBtn = document.getElementById('camera-btn');
      const videoElement = document.getElementById('webcam');
      const errorMsg = document.getElementById('error-msg');

      if (!cameraBtn || !videoElement) {
        console.error('אלמנטים אינם קיימים ב-DOM');
        return;
      }

      cameraBtn.addEventListener('click', async () => {
        console.log('כפתור המצלמה נלחץ');
        errorMsg.textContent = '';

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          errorMsg.textContent = 'הדפדפן אינו תומך בגישה למצלמה (וודא שאתה עובד ב-HTTPS או localhost).';
          return;
        }

        try {
          const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: 'user' }, 
            audio: false 
          });
          videoElement.srcObject = stream;
          console.log('המצלמה הופעלה בהצלחה');
        } catch (err) {
          console.error('שגיאה בגישה למצלמה:', err);
          if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
            errorMsg.textContent = 'הרשאת המצלמה נדחתה בדפדפן.';
          } else {
            errorMsg.textContent = 'לא ניתן להפעיל את המצלמה: ' + err.message;
          }
        }
      });
    });
  </script>

</body>
</html>
